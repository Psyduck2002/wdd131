<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Confirmation page for messages submitted through the PsychKy Gaming contact form.">

    <meta name="author" content="Kyle Roper">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/psychky.css">

    <script src="scripts/psychky.js" defer></script>

    <title>PsychKy Gaming | Message Sent</title>
</head>

<body>

    <header class="site-header">

    <img class="site-banner"
        src="images/psychky-banner.jpg"
        alt="PsychKy Gaming banner">

    <div class="nav-container">

        <button class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="primary-navigation">
            ☰
        </button>

        <nav id="primary-navigation"
            class="primary-navigation"
            aria-label="Primary navigation">

            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="contact.html">Contact Me</a>

        </nav>

    </div>

</header>


    <main>

        <section class="thank-you-card">

            <div class="checkmark" aria-hidden="true">
                ✓
            </div>

            <p class="eyebrow">
                Message Submitted
            </p>

            <h1 id="thank-you-heading">
                Thanks for Reaching Out!
            </h1>

            <p id="thank-you-message">
                Your message was submitted through the PsychKy Gaming
                contact form.
            </p>

            <p id="submission-count"
                class="submission-count">
            </p>


            <div class="button-row center-buttons">

                <a class="button primary-button"
                    href="index.html">
                    Back to Home
                </a>

                <a class="button secondary-button"
                    href="contact.html">
                    Send Another Message
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © <span id="current-year"></span>
            PsychKy_Gaming
        </p>

    </footer>

</body>

</html>
