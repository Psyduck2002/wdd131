<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A Product Review Form for users to submit their feedback."
    >
    <meta name="author" content="Kyle Roper">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <title>Product Review Form</title>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <label for="productName">Product Name</label>

            <select id="productName" name="productName" required>
                <option value="" disabled selected>
                    Choose a Product ...
                </option>
            </select>

            <fieldset class="rating-fieldset">
                <legend>Overall Rating</legend>

                <label for="rating1">
                    &star;
                    <input
                        type="radio"
                        id="rating1"
                        name="rating"
                        value="1"
                        required
                    >
                </label>

                <label for="rating2">
                    &star;&star;
                    <input
                        type="radio"
                        id="rating2"
                        name="rating"
                        value="2"
                        required
                    >
                </label>

                <label for="rating3">
                    &star;&star;&star;
                    <input
                        type="radio"
                        id="rating3"
                        name="rating"
                        value="3"
                        required
                    >
                </label>

                <label for="rating4">
                    &star;&star;&star;&star;
                    <input
                        type="radio"
                        id="rating4"
                        name="rating"
                        value="4"
                        required
                    >
                </label>

                <label for="rating5">
                    &star;&star;&star;&star;&star;
                    <input
                        type="radio"
                        id="rating5"
                        name="rating"
                        value="5"
                        required
                    >
                </label>
            </fieldset>

            <label for="installDate">Date of Installation</label>

            <input
                type="date"
                id="installDate"
                name="installDate"
                required
            >

            <fieldset class="features-fieldset">
                <legend>
                    Which features did you find useful in the product?
                </legend>

                <p><em>(Check all that apply)</em></p>

                <label for="durability">
                    <input
                        type="checkbox"
                        id="durability"
                        name="features"
                        value="durability"
                    >
                    Durability
                </label>

                <label for="easeOfUse">
                    <input
                        type="checkbox"
                        id="easeOfUse"
                        name="features"
                        value="ease-of-use"
                    >
                    Ease of Use
                </label>

                <label for="performance">
                    <input
                        type="checkbox"
                        id="performance"
                        name="features"
                        value="performance"
                    >
                    Performance
                </label>

                <label for="design">
                    <input
                        type="checkbox"
                        id="design"
                        name="features"
                        value="design"
                    >
                    Design
                </label>
            </fieldset>

            <label for="review">
                Written Review <span class="optional">(Optional)</span>
            </label>

            <textarea
                id="review"
                name="review"
                rows="6"
            ></textarea>

            <label for="userName">
                Your Name <span class="optional">(Optional)</span>
            </label>

            <input
                type="text"
                id="userName"
                name="userName"
            >

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Kyle Roper | California, USA
        </p>

        <p id="lastModified"></p>
    </footer>
</body>
</html>
